<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft v2 — Title Menu (pixel horror) | เรือนซ่อนวิญญาณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #050407; }
  body {
    font-family: 'Kanit', 'Noto Sans Thai', sans-serif;
    color: #ded5c6;
    position: relative;
    -webkit-font-smoothing: none;
  }

  /* ---------------- scene ---------------- */
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .scene img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    filter: brightness(0.62) saturate(1.05) contrast(1.15) hue-rotate(-8deg);
    transform: scale(1.06);
  }
  .scene::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 68% 55%, rgba(90, 20, 25, 0.12), rgba(4, 3, 6, 0.9) 72%),
      linear-gradient(90deg, rgba(4, 3, 6, 0.94) 0%, rgba(4, 3, 6, 0.55) 40%, rgba(4, 3, 6, 0.22) 68%, rgba(4, 3, 6, 0.75) 100%);
  }
  .tint {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 120%, rgba(120, 12, 18, 0.35), transparent 60%),
      linear-gradient(0deg, rgba(30, 6, 10, 0.65), transparent 45%);
    mix-blend-mode: multiply;
  }

  /* rain */
  .rain, .rain.b { position: absolute; inset: -20% -10%; pointer-events: none; opacity: 0.22; }
  .rain {
    background-image: repeating-linear-gradient(
      100deg,
      rgba(200, 215, 225, 0.5) 0px, rgba(200, 215, 225, 0.5) 1px,
      transparent 1px, transparent 14px
    );
    animation: rainFall 0.55s linear infinite;
  }
  .rain.b {
    opacity: 0.12;
    background-image: repeating-linear-gradient(
      96deg,
      rgba(230, 240, 255, 0.6) 0px, rgba(230, 240, 255, 0.6) 1px,
      transparent 1px, transparent 26px
    );
    animation: rainFall 0.85s linear infinite;
  }
  @keyframes rainFall {
    from { transform: translate3d(0, -12%, 0); }
    to   { transform: translate3d(-2%, 12%, 0); }
  }

  .fog {
    position: absolute; left: -10%; right: -10%; bottom: -6%; height: 46%;
    background: radial-gradient(ellipse at 55% 100%, rgba(150, 160, 170, 0.2), transparent 62%);
    filter: blur(18px); pointer-events: none;
  }

  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.34) 0px, rgba(0,0,0,0.34) 1px, transparent 1px, transparent 3px);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0.09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 7;
    box-shadow: inset 0 0 200px 80px rgba(0,0,0,0.92), inset 0 0 60px 10px rgba(0,0,0,0.7);
  }

  /* ---------------- character ---------------- */
  .actor {
    position: absolute; right: 9%; bottom: 12%;
    z-index: 3;
    display: flex; flex-direction: column; align-items: center;
  }
  .actor .glow {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 340px; height: 90px;
    background: radial-gradient(ellipse at center, rgba(190, 70, 50, 0.28), transparent 68%);
    filter: blur(6px);
  }
  .actor .ghost-shadow {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    height: 340px; opacity: 0.2; filter: brightness(0.45) grayscale(0.5);
    image-rendering: pixelated;
    mix-blend-mode: screen;
  }
  .actor img.sprite {
    position: relative;
    height: 46vh; min-height: 300px; max-height: 470px; width: auto;
    image-rendering: pixelated;
    filter: brightness(0.88) contrast(1.1) saturate(0.82) drop-shadow(0 0 26px rgba(0,0,0,0.9));
    animation: breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .actor .tag {
    margin-top: 10px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px; letter-spacing: 2.4px;
    color: #c39a86; opacity: 0.85;
  }
  .ground-shadow {
    position: absolute; right: 9%; bottom: 10%; z-index: 2;
    width: 300px; height: 26px; transform: translateX(14%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.85), transparent 70%);
    filter: blur(3px);
  }

  /* ---------------- menu (left) ---------------- */
  .menu-wrap {
    position: absolute; left: clamp(34px, 6vw, 110px); top: 50%;
    transform: translateY(-46%);
    z-index: 5;
    max-width: 52vw;
  }

  .logo { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-bottom: 6px; }
  .sigil-wrap { position: relative; margin-bottom: 12px; margin-left: -10px; transform: translateY(-4px); }
  .sigil-wrap::before {
    content: ''; position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 210px; height: 210px; border-radius: 50%;
    background: radial-gradient(circle, rgba(170, 14, 20, 0.4), rgba(120, 8, 12, 0.12) 45%, transparent 70%);
    filter: blur(4px);
  }
  .logo .sigil {
    position: relative;
    height: 138px; width: auto; flex: none;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 14px rgba(150, 16, 20, 0.85)) contrast(1.15) brightness(0.9) saturate(0.85);
    opacity: 0.96;
    animation: sigilFlicker 5.5s steps(1, end) infinite;
  }
  @keyframes sigilFlicker {
    0%, 92%, 100% { opacity: 0.95; }
    93% { opacity: 0.35; }
    94% { opacity: 0.95; }
    96% { opacity: 0.5; }
    97% { opacity: 0.95; }
  }
  h1 {
    font-weight: 800;
    font-size: clamp(40px, 4.6vw, 72px);
    line-height: 0.98;
    letter-spacing: 0.5px;
    color: #a5171d;
    -webkit-text-stroke: 0.6px rgba(20, 0, 2, 0.55);
    text-shadow:
      0 0 1px rgba(255, 70, 60, 0.9),
      0 0 12px rgba(165, 10, 15, 0.65),
      0 0 26px rgba(110, 0, 6, 0.45),
      3px 4px 0 #360406;
    transform: skew(-1.5deg);
  }
  .logo-sub {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10.5px; letter-spacing: 4.5px;
    color: #7d6a5c; margin: 8px 0 26px 3px;
  }

  nav.menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .item {
    position: relative;
    display: block; width: auto;
    font-family: inherit; font-weight: 600;
    font-size: clamp(21px, 2.05vw, 30px);
    line-height: 1.42;
    color: #cec4b4;
    background: none; border: 0; cursor: pointer;
    padding: 2px 10px 2px 26px;
    text-align: left;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.8);
    transition: color .12s, transform .12s;
  }
  .item::before {
    content: '▶';
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    font-size: 0.5em; color: #ff3b30; opacity: 0;
    text-shadow: 0 0 10px rgba(255, 40, 30, 0.9);
  }
  .item:hover { color: #f2e8d6; }
  .item.sel {
    color: #ff3a30;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.9), 0 0 16px rgba(255, 40, 30, 0.55), 0 0 42px rgba(180, 10, 15, 0.4);
  }
  .item.sel::before { opacity: 1; }

  .item .hint {
    display: block;
    font-family: 'Sarabun', sans-serif;
    font-size: 12px; font-weight: 400; letter-spacing: 0.2px;
    color: #8d7f6d; margin-top: -2px;
  }
  .item.sel .hint { color: #c08a80; }

  .divider {
    width: 190px; height: 1px; margin: 12px 0 10px 4px;
    background: linear-gradient(90deg, rgba(255, 60, 50, 0.55), rgba(255, 60, 50, 0));
  }

  .version {
    margin-top: 26px; margin-left: 3px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10.5px; letter-spacing: 2px; color: #5f5548;
  }

  /* ---------------- footer hints ---------------- */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(34px, 6vw, 110px) 22px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12.5px; color: #8b8172; letter-spacing: 0.6px;
  }
  .keys { display: flex; align-items: center; gap: 22px; }
  .key { display: flex; align-items: center; gap: 8px; }
  .badge-key {
    width: 19px; height: 19px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700;
    border: 1.5px solid currentColor;
  }
  .key.b { color: #c8453f; }
  .key.a { color: #6fbe6a; }
  .key.e { color: #c9a45a; }
  .foot .right { display: flex; align-items: center; gap: 14px; color: #6b6255; }
  .foot .right b { color: #b99b6b; font-weight: 700; letter-spacing: 1px; }

  @media (max-width: 900px) {
    .menu-wrap { max-width: 70vw; }
    .actor { right: 2%; opacity: 0.9; }
    .actor img.sprite { height: 34vh; min-height: 220px; }
    .ground-shadow { width: 200px; }
    .logo .sigil { width: 56px; height: 56px; }
    .foot { font-size: 10.5px; padding-bottom: 14px; }
    .foot .keys { gap: 12px; }
  }
</style>
</head>
<body>
  <div class="scene">
    <img class="bg" src="../public/assets/bg_scene1_forest.jpg" alt="" />
    <div class="tint"></div>
    <div class="rain"></div>
    <div class="rain b"></div>
    <div class="fog"></div>
  </div>

  <div class="ground-shadow"></div>

  <div class="actor">
    <div class="glow"></div>
    <img class="ghost-shadow" src="../public/assets/ghost_dancer_2.png" alt="" />
    <img class="sprite" src="../public/assets/student_male_0.png" alt="นนท์" />
    <div class="tag">นนท์ · ผู้หลงในเรือน</div>
  </div>

  <div class="menu-wrap">
    <div class="logo">
      <div class="sigil-wrap"><img class="sigil" src="../public/assets/ghost_dancer_2.png" alt="" /></div>
      <h1>เรือนซ่อนวิญญาณ</h1>
    </div>
    <div class="logo-sub">THE VEILED THAI HOUSE</div>

    <nav class="menu">
      <button class="item sel">
        เล่นต่อ
        <span class="hint">ฉากที่ 3 · ห้องเครื่องเซ่น · 18:42</span>
      </button>
      <button class="item">เริ่มเกมใหม่</button>
      <button class="item">เล่น 2 คน (QR Code)</button>
      <div class="divider"></div>
      <button class="item">ตั้งค่า</button>
      <button class="item">วิธีเล่น</button>
    </nav>

    <div class="version">v1.1.0 · OPEN HOUSE BUU 20–21</div>
  </div>

  <div class="scanlines"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="foot">
    <div class="keys">
      <span class="key b"><span class="badge-key">B</span> กลับ</span>
      <span class="key a"><span class="badge-key">A</span> ยืนยัน</span>
      <span class="key e"><span class="badge-key">E</span> เลือก</span>
    </div>
    <div class="right"><span>ENTER / ↑↓ เลื่อนเมนู</span></div>
  </div>
</body>
</html>
